<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=https://yehsheng.com/about.html">
    <link rel="canonical" href="https://yehsheng.com/about.html">
    <meta name="robots" content="noindex, follow">
    <title>Redirecting to About Us - Yeh Sheng</title>
    <script>window.location.replace("https://yehsheng.com/about.html");</script>

<style id="mega-menu-custom-styles">
    /* Mega Menu Custom Styles */
    .mega-menu-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: -20px;
        background: #ffffff;
        border-top: 3px solid #C5A059;
        box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        border-radius: 0 0 8px 8px;
        padding: 24px;
        z-index: 1100;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .mega-menu-panel.is-active {
        display: block !important;
        animation: megaFadeIn 0.2s ease forwards;
    }
    @keyframes megaFadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .mega-link {
        transition: background-color 0.15s ease, color 0.15s ease;
        text-decoration: none;
        line-height: 1.4 !important;
    }
    .mega-link:hover, .mega-link:focus-visible {
        background-color: #f4f5f7;
        color: #996B1D !important;
        outline: none;
    }
    .dropdown-toggle:focus-visible, .nav-item a:focus-visible {
        outline: 2px solid #C5A059;
        outline-offset: 3px;
        border-radius: 4px;
    }
    .mobile-menu-drawer {
        max-height: 80vh;
        overflow-y: auto;
    }
    @media (max-width: 991px) {
        .hidden-mobile { display: none !important; }
        .mobile-menu-btn { display: block !important; }
    }
    @media (min-width: 992px) {
        .mobile-menu-btn { display: none !important; }
        .mobile-menu-drawer { display: none !important; }
    }
    /* Hero Carousel Responsive & Typography Tweaks */
    .text-carousel-container {
        position: relative;
        overflow: hidden;
        min-height: 340px;
    }
    .text-carousel-slide h2 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(30px, 4.5vw, 52px) !important;
        line-height: 1.25 !important;
        font-weight: 700;
        color: #111;
        margin: 0 0 20px 0;
        white-space: normal !important;
        word-break: keep-all;
    }
    .text-carousel-slide p {
        font-family: 'Inter', sans-serif;
        font-size: clamp(16px, 2vw, 20px) !important;
        font-weight: 400;
        line-height: 1.6 !important;
        color: #444;
        margin-bottom: 25px;
    }
</style>

</head>

<body>
    <p>This page has moved. <a href="https://yehsheng.com/about.html">Click here</a> if not redirected.</p>

<script id="mega-menu-custom-js">
    (function() {
        var dropdownItems = document.querySelectorAll('.mega-dropdown-item');
        var closeTimers = {};

        dropdownItems.forEach(function(item, idx) {
            var button = item.querySelector('.dropdown-toggle');
            var panel = item.querySelector('.mega-menu-panel');

            if (!button || !panel) return;

            function openMenu() {
                dropdownItems.forEach(function(otherItem) {
                    if (otherItem !== item) {
                        var otherBtn = otherItem.querySelector('.dropdown-toggle');
                        var otherPanel = otherItem.querySelector('.mega-menu-panel');
                        if (otherBtn) otherBtn.setAttribute('aria-expanded', 'false');
                        if (otherPanel) {
                            otherPanel.classList.remove('is-active');
                            otherPanel.style.display = 'none';
                        }
                    }
                });
                clearTimeout(closeTimers[idx]);
                button.setAttribute('aria-expanded', 'true');
                panel.style.display = 'block';
                panel.classList.add('is-active');
            }

            function closeMenu() {
                closeTimers[idx] = setTimeout(function() {
                    button.setAttribute('aria-expanded', 'false');
                    panel.classList.remove('is-active');
                    panel.style.display = 'none';
                }, 200);
            }

            button.addEventListener('click', function(e) {
                e.preventDefault();
                var isOpen = button.getAttribute('aria-expanded') === 'true';
                if (isOpen) {
                    button.setAttribute('aria-expanded', 'false');
                    panel.classList.remove('is-active');
                    panel.style.display = 'none';
                } else {
                    openMenu();
                }
            });

            item.addEventListener('mouseenter', openMenu);
            item.addEventListener('mouseleave', closeMenu);

            item.addEventListener('focusin', function() {
                clearTimeout(closeTimers[idx]);
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                dropdownItems.forEach(function(item) {
                    var button = item.querySelector('.dropdown-toggle');
                    var panel = item.querySelector('.mega-menu-panel');
                    if (button) button.setAttribute('aria-expanded', 'false');
                    if (panel) {
                        panel.classList.remove('is-active');
                        panel.style.display = 'none';
                    }
                });
                var drawer = document.getElementById('mobileMenu');
                if (drawer) {
                    drawer.style.display = 'none';
                    drawer.classList.remove('active');
                }
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.mega-dropdown-item') && !e.target.closest('.mobile-menu-drawer') && !e.target.closest('.mobile-menu-btn')) {
                dropdownItems.forEach(function(item) {
                    var button = item.querySelector('.dropdown-toggle');
                    var panel = item.querySelector('.mega-menu-panel');
                    if (button) button.setAttribute('aria-expanded', 'false');
                    if (panel) {
                        panel.classList.remove('is-active');
                        panel.style.display = 'none';
                    }
                });
            }
        });
    })();

    function toggleMobileMenu() {
        var drawer = document.getElementById('mobileMenu');
        var btn = document.querySelector('.mobile-menu-btn');
        if (!drawer) return;
        var isOpen = drawer.style.display === 'flex';
        if (isOpen) {
            drawer.style.display = 'none';
            if (btn) btn.setAttribute('aria-expanded', 'false');
        } else {
            drawer.style.display = 'flex';
            if (btn) btn.setAttribute('aria-expanded', 'true');
        }
    }

    function toggleMobileAccordion(btn) {
        var content = btn.nextElementSibling;
        var icon = btn.querySelector('.acc-icon');
        if (!content) return;
        var isOpen = content.style.display === 'flex';
        if (isOpen) {
            content.style.display = 'none';
            btn.setAttribute('aria-expanded', 'false');
            if (icon) icon.textContent = '▼';
        } else {
            content.style.display = 'flex';
            btn.setAttribute('aria-expanded', 'true');
            if (icon) icon.textContent = '▲';
        }
    }
</script>


<script id="carousel-custom-js">
    let slideIndex = 1;
    let slideTimer = null;
    let isPaused = false;

    showSlides(slideIndex);

    function currentSlide(n) {
        showSlides(slideIndex = n);
    }

    function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("text-carousel-slide");
        let dots = document.getElementsByClassName("indicator");
        if (!slides || slides.length === 0) return;
        if (n > slides.length) { slideIndex = 1 }
        if (n < 1) { slideIndex = slides.length }
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
            slides[i].classList.remove("active");
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }
        slides[slideIndex - 1].style.display = "block";
        slides[slideIndex - 1].classList.add("active");
        if (dots.length > slideIndex - 1) {
            dots[slideIndex - 1].className += " active";
        }
    }

    function startTimer() {
        stopTimer();
        slideTimer = setInterval(function () {
            if (!isPaused) {
                slideIndex++;
                showSlides(slideIndex);
            }
        }, 7500);
    }

    function stopTimer() {
        if (slideTimer) clearInterval(slideTimer);
    }

    startTimer();

    // Pause Carousel on Hover & Focus
    let container = document.querySelector('.text-carousel-container');
    if (container) {
        container.addEventListener('mouseenter', function() { isPaused = true; });
        container.addEventListener('mouseleave', function() { isPaused = false; });
        container.addEventListener('focusin', function() { isPaused = true; });
        container.addEventListener('focusout', function() { isPaused = false; });
    }

    // Keyboard Accessibility for Indicators
    let dots = document.querySelectorAll('.indicator');
    dots.forEach(function(dot, idx) {
        dot.setAttribute('tabindex', '0');
        dot.setAttribute('role', 'button');
        dot.setAttribute('aria-label', 'Go to slide ' + (idx + 1));
        dot.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                currentSlide(idx + 1);
            }
        });
    });
</script>

</body>

</html>
